server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: project-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/projects/**
        - id: workforce-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/workforce/**
        - id: inventory-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/inventory/**
        - id: equipment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/equipment/**
        - id: finance-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/finance/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
