server:
  port: 8083

spring:
  application:
    name: workforce-service
  datasource:
    url: jdbc:mysql://localhost:3306/buildflow_workforce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: password # Replace with env variable in production
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
