      - key: MYSQL_USER
        value: 5HwsQoxdBRBr97F.root
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        value: REQUIRED
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: buildflow-kafka-buildflow-cloud.a.aivencloud.com:21846
      - key: KAFKA_USERNAME
        value: avnadmin
      - key: KAFKA_PASSWORD
        sync: false
      - key: KAFKA_CA_CERT
        sync: false

  - type: web
