# Render Blueprint specification for BuildFlow Java Spring Boot microservices.
#
# Pre-configured non-secret cloud endpoints:
# - TiDB Cloud (MySQL-compatible): gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000 (sslMode=REQUIRED)
#   IMPORTANT: In TiDB Cloud Console -> Networking, allow Render outbound access (0.0.0.0/0 or Render egress IPs).
# - Upstash Redis (TLS): enabled-reptile-175680.upstash.io:6379
# - Aiven Apache Kafka (SASL_SSL): buildflow-kafka-buildflow-cloud.a.aivencloud.com:21846 (user: avnadmin)
#
# Secret variables marked `sync: false` must be entered in the Render Blueprint prompt/Dashboard:
# - MYSQL_PASSWORD (TiDB password)
# - KAFKA_PASSWORD (Aiven avnadmin password)
# - KAFKA_CA_CERT (Aiven ca.pem certificate)
# - SPRING_DATA_REDIS_PASSWORD (Upstash Redis token/password)
#
# Networking note:
# - `fromService` (`hostport`) uses Render Private Networking (requires `starter` plan or higher).
# - If staying on `plan: free`, add `<SERVICE>_SERVICE_URL=https://<service>.onrender.com` in Render
#   Dashboard -> Environment on `buildflow-api-gateway` (and `PROJECT_SERVICE_URL` on downstream services).

services:
  - type: web
    name: buildflow-api-gateway
    runtime: docker
    plan: free
    dockerContext: ./backend/api-gateway
    dockerfilePath: ./backend/api-gateway/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://build-flow-sooty.vercel.app,https://*.vercel.app,http://localhost:*,http://127.0.0.1:*
      - key: JWT_SECRET
        fromService:
          type: web
          name: buildflow-auth-service
          envVarKey: JWT_SECRET
      - key: AUTH_SERVICE_HOSTPORT
        fromService:
          type: web
          name: buildflow-auth-service
          property: hostport
      - key: PROJECT_SERVICE_HOSTPORT
        fromService:
          type: web
          name: buildflow-project-service
          property: hostport
      - key: WORKFORCE_SERVICE_HOSTPORT
        fromService:
          type: web
          name: buildflow-workforce-service
          property: hostport
      - key: INVENTORY_SERVICE_HOSTPORT
        fromService:
          type: web
          name: buildflow-inventory-service
          property: hostport
      - key: EQUIPMENT_SERVICE_HOSTPORT
        fromService:
          type: web
          name: buildflow-equipment-service
          property: hostport
      - key: FINANCE_SERVICE_HOSTPORT
        fromService:
          type: web
          name: buildflow-finance-service
          property: hostport
      - key: REPORTING_SERVICE_HOSTPORT
        fromService:
          type: web
          name: buildflow-reporting-service
          property: hostport

  - type: web
    name: buildflow-auth-service
    runtime: docker
    plan: free
    dockerContext: ./backend/auth-service
    dockerfilePath: ./backend/auth-service/Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DB
        value: buildflow_auth
      - key: MYSQL_USER
        value: 5HwsQoxdBRBr97F.root
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        value: REQUIRED

  - type: web
    name: buildflow-project-service
    runtime: docker
    plan: free
    dockerContext: ./backend/project-service
    dockerfilePath: ./backend/project-service/Dockerfile
