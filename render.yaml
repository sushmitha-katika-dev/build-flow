# Render Blueprint specification for BuildFlow Java Spring Boot microservices.
#
# Pre-configured non-secret cloud endpoints:
# - TiDB Cloud (MySQL-compatible): gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000 (sslMode=REQUIRED)
# - Upstash Redis (TLS): enabled-reptile-175680.upstash.io:6379
# - Aiven Apache Kafka (SASL_SSL): buildflow-kafka-buildflow-cloud.a.aivencloud.com:21846 (user: avnadmin)
#
# Secret variables marked `sync: false` must be set in Render Dashboard:
# - MYSQL_PASSWORD, KAFKA_PASSWORD, KAFKA_CA_CERT, SPRING_DATA_REDIS_PASSWORD
#
# Uses explicit public `https://*.onrender.com` URLs so services on `plan: free`
# communicate cleanly without requiring paid private networking.

services:
  - type: web
    name: buildflow-api-gateway
    runtime: docker
    plan: free
    dockerContext: ./backend/api-gateway
    dockerfilePath: ./backend/api-gateway/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://build-flow-sooty.vercel.app,https://*.vercel.app,http://localhost:*,http://127.0.0.1:*
      - key: JWT_SECRET
        fromService:
          type: web
          name: buildflow-auth-service
          envVarKey: JWT_SECRET
      - key: AUTH_SERVICE_URL
        value: https://buildflow-auth-service.onrender.com
      - key: PROJECT_SERVICE_URL
        value: https://buildflow-project-service.onrender.com
      - key: WORKFORCE_SERVICE_URL
        value: https://buildflow-workforce-service.onrender.com
      - key: INVENTORY_SERVICE_URL
        value: https://buildflow-inventory-service.onrender.com
      - key: EQUIPMENT_SERVICE_URL
        value: https://buildflow-equipment-service.onrender.com
      - key: FINANCE_SERVICE_URL
        value: https://buildflow-finance-service.onrender.com
      - key: REPORTING_SERVICE_URL
        value: https://buildflow-reporting-service.onrender.com

  - type: web
    name: buildflow-auth-service
    runtime: docker
    plan: free
    dockerContext: ./backend/auth-service
    dockerfilePath: ./backend/auth-service/Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DB
        value: buildflow_auth
      - key: MYSQL_USER
        value: 5HwsQoxdBRBr97F.root
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        value: REQUIRED

  - type: web
    name: buildflow-project-service
    runtime: docker
    plan: free
    dockerContext: ./backend/project-service
    dockerfilePath: ./backend/project-service/Dockerfile
    envVars:
      - key: MYSQL_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DB
        value: buildflow_project
      - key: MYSQL_USER
        value: 5HwsQoxdBRBr97F.root
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        value: REQUIRED
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: buildflow-kafka-buildflow-cloud.a.aivencloud.com:21846
      - key: KAFKA_USERNAME
        value: avnadmin
      - key: KAFKA_PASSWORD
        sync: false
      - key: KAFKA_CA_CERT
        sync: false

  - type: web
    name: buildflow-workforce-service
    runtime: docker
    plan: free
