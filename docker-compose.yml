version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: buildflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildflow-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: buildflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - buildflow-net
    healthcheck:
      test: echo stat | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: buildflow-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - buildflow-net
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: buildflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildflow-net

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - buildflow-net
    depends_on:
      - auth-service
      - project-service
      - workforce-service
      - inventory-service
      - equipment-service
      - finance-service
      - reporting-service

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/buildflow_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - buildflow-net
    depends_on:
      mysql:
        condition: service_healthy

  project-service:
    build:
      context: ./backend/project-service
    container_name: project-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/buildflow_project?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      - buildflow-net
    depends_on:
      mysql:
        condition: service_healthy

  workforce-service:
    build:
      context: ./backend/workforce-service
    container_name: workforce-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/buildflow_workforce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - buildflow-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-service:
    build:
      context: ./backend/inventory-service
    container_name: inventory-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/buildflow_inventory?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - buildflow-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  equipment-service:
    build:
      context: ./backend/equipment-service
    container_name: equipment-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/buildflow_equipment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - buildflow-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  finance-service:
    build:
      context: ./backend/finance-service
    container_name: finance-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/buildflow_finance?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - buildflow-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  reporting-service:
    build:
      context: ./backend/reporting-service
    container_name: reporting-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/buildflow_reporting?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    networks:
      - buildflow-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: buildflow-frontend
    ports:
      - "80:80"
    networks:
      - buildflow-net
    depends_on:
      - api-gateway

networks:
  buildflow-net:
    driver: bridge

volumes:
  mysql_data:
